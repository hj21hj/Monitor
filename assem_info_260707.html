<!DOCTYPE html>
<html lang="ko">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DZN77QMBX7"></script>
    <script>
    const PROXY_URL = "https://script.google.com/macros/s/AKfycbx674hDBg15__FCk1XB2HqOuxWMNB6Y2qn7b7WATT3QMCBNb4vPQzml7uZY8MJtbalU3A/exec";

    let allMembers = [];
    let currentFiltered = [];
    let monitorData = { naver: [], google: [], yt: [], bill: [], seminar: [] };
    let monitorPage = { naver: 1, google: 1, yt: 1, bill: 1, seminar: 1 };

    window.onload = fetchAllAssemblyData;

    function apiUrl(type, params = {}) {
        const usp = new URLSearchParams({ type, ...params });
        return `${PROXY_URL}?${usp.toString()}`;
    }

    function isToday(d) {
        return d && new Date().toDateString() === new Date(d).toDateString();
    }

    function applyHighlight(text, searchWord) {
        if (!text) return '';
        if (!searchWord) return String(text).replace(/<[^>]*>?/gm, '');
        const cleanText = String(text).replace(/<[^>]*>?/gm, '');
        const safeWord = searchWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(${safeWord})`, 'gi');
        return cleanText.replace(regex, `<span class="highlight">$1</span>`);
    }

    async function fetchAllAssemblyData() {
        document.getElementById('loading').style.display = 'block';
        try {
            const res = await fetch(apiUrl('members'));
            const data = await res.json();

            if (data.nwvrqwxyaytdsfvhu) {
                allMembers = data.nwvrqwxyaytdsfvhu[1].row || [];
                handleFilter();
            } else {
                console.error(data);
                renderTable([]);
            }
        } catch (e) {
            console.error(e);
            renderTable([]);
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    async function handleFilter() {
        const committee = document.getElementById('committeeSelect').value;
        const text = document.getElementById('unifiedSearch').value.trim().toLowerCase();
        const committeeMembers = allMembers.filter(m => !committee || (m.CMITS && m.CMITS.includes(committee)));

        if (!text) {
            committeeMembers.forEach(m => {
                m.matchReasons = [];
                m.searchPriority = 99;
                m.latestActionDate = 0;
            });
            currentFiltered = committeeMembers;
            handleSort(document.getElementById('topSort').value);
            return;
        }

        document.getElementById('loading').style.display = 'block';
        let matchMap = new Map();

        committeeMembers.forEach(m => {
            let priority = 99;
            if (m.HG_NM && m.HG_NM.toLowerCase() === text) priority = 1;
            else if (m.HG_NM && m.HG_NM.toLowerCase().includes(text)) priority = 2;
            else if ([m.STAFF, m.SECRETARY, m.SECRETARY2].some(v => v && v.toLowerCase().includes(text))) priority = 3;
            else if ([m.ASSEM_ADDR, m.ORIG_NM].some(v => v && v.toLowerCase().includes(text))) priority = 7;

            if (priority !== 99) {
                matchMap.set(m.MONA_CD, { reasons: ['기본정보 매칭'], priority, date: 0 });
            }
        });

        if (text.length >= 2) {
            try {
                const [billRes, naverRes, googleRes, semiRes] = await Promise.all([
                    fetch(apiUrl('bills', { q: text, pSize: 100 })),
                    fetch(apiUrl('naver', { q: text, display: 50 })),
                    fetch(apiUrl('google', { q: text })),
                    fetch(apiUrl('seminars', { q: text, pSize: 100 }))
                ]);

                const billData = await billRes.json();
                const naverData = await naverRes.json();
                const googleData = await googleRes.json();
                const semiData = await semiRes.json();

                if (billData.TVBPMBILL11) {
                    billData.TVBPMBILL11[1].row.forEach(r => {
                        const proposers = (r.PROPOSER || '').split('(')[0].trim();
                        const billDate = new Date(r.PROPOSE_DT).getTime();
                        committeeMembers.forEach(m => {
                            if (proposers.includes(m.HG_NM)) {
                                let info = matchMap.get(m.MONA_CD) || { reasons: [], priority: 99, date: 0 };
                                if (!info.reasons.includes('의안명 매칭')) info.reasons.push('의안명 매칭');
                                info.priority = Math.min(info.priority, 4);
                                info.date = Math.max(info.date, billDate);
                                matchMap.set(m.MONA_CD, info);
                            }
                        });
                    });
                }

                if (naverData.items) {
                    naverData.items.forEach(i => {
                        const title = (i.title || '').replace(/<[^>]*>?/gm, '');
                        const neDate = new Date(i.pubDate).getTime();
                        committeeMembers.forEach(m => {
                            if (title.includes(m.HG_NM)) {
                                let info = matchMap.get(m.MONA_CD) || { reasons: [], priority: 99, date: 0 };
                                if (!info.reasons.includes('뉴스매칭(네)')) info.reasons.push('뉴스매칭(네)');
                                info.priority = Math.min(info.priority, 5);
                                info.date = Math.max(info.date, neDate);
                                matchMap.set(m.MONA_CD, info);
                            }
                        });
                    });
                }

                if (googleData.items) {
                    googleData.items.forEach(gi => {
                        const title = gi.title || '';
                        const neDate = new Date(gi.pubDate).getTime();
                        committeeMembers.forEach(m => {
                            if (title.includes(m.HG_NM)) {
                                let info = matchMap.get(m.MONA_CD) || { reasons: [], priority: 99, date: 0 };
                                if (!info.reasons.includes('뉴스매칭(구)')) info.reasons.push('뉴스매칭(구)');
                                info.priority = Math.min(info.priority, 5);
                                info.date = Math.max(info.date, neDate);
                                matchMap.set(m.MONA_CD, info);
                            }
                        });
                    });
                }

                if (semiData.nfcoioopazrwmjrgs) {
                    semiData.nfcoioopazrwmjrgs[1].row.forEach(r => {
                        const semiDate = new Date(r.SDATE).getTime();
                        committeeMembers.forEach(m => {
                            if (r.NAME && r.NAME.includes(m.HG_NM)) {
                                let info = matchMap.get(m.MONA_CD) || { reasons: [], priority: 99, date: 0 };
                                if (!info.reasons.includes('행사명 매칭')) info.reasons.push('행사명 매칭');
                                info.priority = Math.min(info.priority, 6);
                                info.date = Math.max(info.date, semiDate);
                                matchMap.set(m.MONA_CD, info);
                            }
                        });
                    });
                }
            } catch (e) {
                console.error(e);
            }
        }

        currentFiltered = committeeMembers.filter(m => {
            if (matchMap.has(m.MONA_CD)) {
                let info = matchMap.get(m.MONA_CD);
                m.matchReasons = info.reasons;
                m.searchPriority = info.priority;
                m.latestActionDate = info.date;
                return true;
            }
            return false;
        });

        document.getElementById('loading').style.display = 'none';
        currentFiltered.sort((a, b) => a.searchPriority - b.searchPriority || b.latestActionDate - a.latestActionDate);
        renderTable(currentFiltered);
    }

    async function handleSort(criteria) {
        document.getElementById('topSort').value = criteria;
        document.getElementById('bottomSort').value = criteria;
        if (criteria === 'NEAR_SEMINAR') { await sortBySeminar(); return; }
        if (criteria === 'PROPOSE_DESC') { await sortByBillDate(); return; }
        if (criteria === 'LATEST_NEWS') { await sortByLatestNews(); return; }

        currentFiltered.sort((a, b) => {
            if (a.searchPriority !== b.searchPriority) return a.searchPriority - b.searchPriority;
            if (criteria === 'HG_NM') return (a.HG_NM || '').localeCompare(b.HG_NM || '', 'ko');
            if (criteria === 'ROOM_DESC') return (parseInt((b.ASSEM_ADDR || '').replace(/[^0-9]/g, '')) || 0) - (parseInt((a.ASSEM_ADDR || '').replace(/[^0-9]/g, '')) || 0);
            if (criteria === 'UNITS_DESC') return (b.UNITS || '').split(',').length - (a.UNITS || '').split(',').length;
            return b.latestActionDate - a.latestActionDate;
        });
        renderTable(currentFiltered);
    }

    async function sortByLatestNews() {
        document.getElementById('loading').style.display = 'block';
        const p = currentFiltered.map(async m => {
            try {
                const q = `"${m.POLY_NM}" "${m.HG_NM}"`;
                const res = await fetch(apiUrl('naver', { q, display: 1 }));
                const data = await res.json();
                m.latestNewsDate = data.items && data.items.length > 0 ? new Date(data.items[0].pubDate) : new Date(0);
            } catch {
                m.latestNewsDate = new Date(0);
            }
            return m;
        });
        currentFiltered = await Promise.all(p);
        currentFiltered.sort((a, b) => (a.searchPriority !== b.searchPriority) ? a.searchPriority - b.searchPriority : b.latestNewsDate - a.latestNewsDate);
        renderTable(currentFiltered);
        document.getElementById('loading').style.display = 'none';
    }

    async function sortByBillDate() {
        document.getElementById('loading').style.display = 'block';
        const p = currentFiltered.map(async m => {
            try {
                const res = await fetch(apiUrl('bills', { name: m.HG_NM, pSize: 1 }));
                const data = await res.json();
                m.lastBillDate = data.TVBPMBILL11 ? new Date(data.TVBPMBILL11[1].row[0].PROPOSE_DT) : new Date(0);
            } catch {
                m.lastBillDate = new Date(0);
            }
            return m;
        });
        currentFiltered = await Promise.all(p);
        currentFiltered.sort((a, b) => (a.searchPriority !== b.searchPriority) ? a.searchPriority - b.searchPriority : b.lastBillDate - a.lastBillDate);
        renderTable(currentFiltered);
        document.getElementById('loading').style.display = 'none';
    }

    async function sortBySeminar() {
        document.getElementById('loading').style.display = 'block';
        const today = new Date().setHours(0, 0, 0, 0);
        const p = currentFiltered.map(async m => {
            try {
                const res = await fetch(apiUrl('seminars', { name: m.HG_NM, pSize: 10 }));
                const data = await res.json();
                m.nextSeminar = data.nfcoioopazrwmjrgs
                    ? data.nfcoioopazrwmjrgs[1].row.map(r => new Date(r.SDATE)).filter(d => d >= today).sort((a, b) => a - b)[0]
                    : null;
            } catch {
                m.nextSeminar = null;
            }
            return m;
        });
        currentFiltered = await Promise.all(p);
        currentFiltered.sort((a, b) => (a.searchPriority !== b.searchPriority) ? a.searchPriority - b.searchPriority : (a.nextSeminar || Infinity) - (b.nextSeminar || Infinity));
        renderTable(currentFiltered);
        document.getElementById('loading').style.display = 'none';
    }

    function renderTable(data) {
        document.getElementById('memberTableBody').innerHTML = data.length ? data.map(item => {
            let badgesHtml = '';
            if (item.matchReasons && item.matchReasons.length > 0) {
                badgesHtml = item.matchReasons.map(reason => {
                    let rClass = 'reason-basic';
                    if (reason === '의안명 매칭') rClass = 'reason-bill';
                    else if (reason.includes('뉴스매칭')) rClass = 'reason-news';
                    else if (reason === '행사명 매칭') rClass = 'reason-seminar';
                    return `<span class="match-reason ${rClass}">${reason}</span>`;
                }).join('');
            }

            return `
            <tr>
                <td data-label="성명">
                    <div class="name-wrapper">
                        <span class="name-link" onclick="openModal('${item.MONA_CD}')">${item.HG_NM}</span>
                        ${(item.REELE_GNB_NM && item.REELE_GNB_NM !== 'undefined') ? `<span class="reele-badge">${item.REELE_GNB_NM}</span>` : ''}
                        ${badgesHtml}
                    </div>
                </td>
                <td data-label="정당"><span class="badge">${item.POLY_NM || '-'}</span></td>
                <td data-label="사무실 호실">${item.ASSEM_ADDR || '-'}</td>
                <td data-label="보좌관" style="font-size:12px; color:#666;">${item.STAFF || '-'}</td>
                <td data-label="선임비서관" style="font-size:12px; color:#666;">${item.SECRETARY || '-'}</td>
            </tr>`;
        }).join('') : '<tr><td colspan="5" style="text-align:center; padding:40px;">선택하신 조건에 해당하는 의원실 정보를 찾을 수 없습니다.<br>위원회를 \'전체 위원회\'와 \'이름순\' 변경하시거나, 검색어를 다시 확인해 주세요.</td></tr>';
    }

    function openModal(monaCd) {
        const item = allMembers.find(m => m.MONA_CD === monaCd);
        if (!item) return;

        ['seminar', 'naver', 'google', 'yt', 'bill'].forEach(s => {
            document.getElementById(`${s}Section`).style.display = 'none';
            document.getElementById(`${s}List`).innerHTML = '';
        });

        document.getElementById('btnSeminar').innerText = '행사일정 보기';
        document.getElementById('btnBill').innerText = '법률안 발의 현황 보기';
        monitorPage = { naver: 1, google: 1, yt: 1, bill: 1, seminar: 1 };
        monitorData = { naver: [], google: [], yt: [], bill: [], seminar: [] };

        const reele = (item.REELE_GNB_NM && item.REELE_GNB_NM !== 'undefined') ? item.REELE_GNB_NM : '';
        const f = [
            ['한자성명', item.HJ_NM], ['정당', item.POLY_NM], ['선거구', item.ORIG_NM],
            ['당선 정보', reele ? `${reele} (${item.UNITS || ''})` : (item.UNITS || '-')],
            ['소속 위원회', item.CMITS], ['전화번호', item.TEL_NO], ['사무실 호실', item.ASSEM_ADDR],
            ['이메일', item.E_MAIL], ['홈페이지', item.HOMEPAGE ? `<a href="${item.HOMEPAGE}" target="_blank" style="color:var(--accent); font-weight:bold;">바로가기</a>` : '-'],
            ['보좌관', item.STAFF], ['선임비서관', item.SECRETARY], ['비서관', item.SECRETARY2]
        ];

        document.getElementById('detailContent').innerHTML = f.map(x => `<tr><th>${x[0]}</th><td>${x[1] || '-'}</td></tr>`).join('');

        const q = `"${item.POLY_NM}" "${item.HG_NM}"`;
        document.getElementById('btnSeminar').onclick = () => toggleAccordion('seminar', item.HG_NM);
        document.getElementById('btnBill').onclick = () => toggleAccordion('bill', item.HG_NM);
        document.getElementById('btnNaver').onclick = () => toggleAccordion('naver', q);
        document.getElementById('btnGoogle').onclick = () => toggleAccordion('google', q);
        document.getElementById('btnYoutube').onclick = () => toggleAccordion('yt', q);
        document.getElementById('detailModal').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    async function toggleAccordion(type, val) {
        const sec = document.getElementById(`${type}Section`);
        const isOpen = sec.style.display === 'block';
        ['seminar', 'naver', 'google', 'yt', 'bill'].forEach(t => document.getElementById(`${t}Section`).style.display = 'none');
        document.getElementById('btnSeminar').innerText = '행사일정 보기';
        document.getElementById('btnBill').innerText = '법률안 발의 현황 보기';

        if (!isOpen) {
            sec.style.display = 'block';
            if (type === 'seminar') {
                document.getElementById('btnSeminar').innerText = '행사일정 닫기';
                if (!monitorData.seminar.length) await fetchSeminars(val); else renderSeminarList();
            } else if (type === 'bill') {
                document.getElementById('btnBill').innerText = '법률안 발의 현황 닫기';
                if (!monitorData.bill.length) await fetchBills(val); else renderBillList();
            } else {
                if (!monitorData[type].length) await fetchMonitorData(type, val); else renderMonitorList(type);
            }
        }
    }

    async function fetchBills(name) {
        const div = document.getElementById('billList');
        div.innerHTML = '조회 중...';
        try {
            const res = await fetch(apiUrl('bills', { name, pSize: 100 }));
            const data = await res.json();
            monitorData.bill = data.TVBPMBILL11 ? data.TVBPMBILL11[1].row : [];
            renderBillList();
        } catch {
            div.innerHTML = '오류 발생';
        }
    }

    function renderBillList() {
        const div = document.getElementById('billList');
        const items = monitorData.bill.slice(0, monitorPage.bill * 10);
        const searchTxt = document.getElementById('unifiedSearch').value.trim();
        let html = items.map(b => {
            const highlightedTitle = applyHighlight(b.BILL_NAME, searchTxt);
            return `<div class="info-item" style="display:block;"><div style="display:flex; align-items:center; width:100%;"><span class="bill-status ${b.PASS_GUBUN === '계류의안' ? 'status-stay' : 'status-pass'}">${b.PASS_GUBUN || '-'}</span><span class="info-title bill-link" onclick="window.open('${b.LINK_URL || '#'}')" style="flex:1;">${highlightedTitle}</span><button class="summary-btn" onclick="toggleBillSummary('${b.BILL_NO}', this)">요약보기</button></div><div class="info-sub ${isToday(b.PROPOSE_DT) ? 'date-today' : ''}" style="margin-top:4px;">제안일: ${b.PROPOSE_DT || '-'} (의안번호: ${b.BILL_NO || '-'})</div><div id="summary_${b.BILL_NO}" class="bill-summary-box">요약을 불러오는 중...</div></div>`;
        }).join('');
        if (items.length < monitorData.bill.length) html += `<button class="more-btn" onclick="monitorPage.bill++; renderBillList()">더보기 (${items.length}/${monitorData.bill.length})</button>`;
        div.innerHTML = html || '내역 없음';
    }

    async function toggleBillSummary(billNo, btn) {
        const box = document.getElementById(`summary_${billNo}`);
        if (box.style.display === 'block') {
            box.style.display = 'none';
            btn.innerText = '요약보기';
            return;
        }
        box.style.display = 'block';
        btn.innerText = '요약닫기';
        if (box.getAttribute('data-loaded') === 'true') return;

        try {
            const res = await fetch(apiUrl('billSummary', { billNo }));
            const data = await res.json();
            if (data.BPMBILLSUMMARY && data.BPMBILLSUMMARY[1].row) {
                const txt = data.BPMBILLSUMMARY[1].row[0].SUMMARY || '요약 내용이 없습니다.';
                box.innerHTML = `<strong>[제안이유 및 주요내용]</strong><br>${txt.replace(/\n/g, '<br>')}`;
            } else {
                box.innerText = '요약 정보가 없습니다.';
            }
            box.setAttribute('data-loaded', 'true');
        } catch {
            box.innerText = '로드 실패';
        }
    }

    async function fetchMonitorData(type, q) {
        const div = document.getElementById(`${type}List`);
        div.innerHTML = '로딩 중...';
        try {
            if (type === 'naver') {
                const res = await fetch(apiUrl('naver', { q, display: 50 }));
                const data = await res.json();
                monitorData.naver = (data.items || []).map(i => ({
                    title: i.title,
                    link: i.link,
                    sub: `${i.originallink ? i.originallink.split('/')[2] : '뉴스'} | ${new Date(i.pubDate).toLocaleDateString()}`,
                    today: isToday(i.pubDate)
                }));
            } else if (type === 'google') {
                const res = await fetch(apiUrl('google', { q }));
                const data = await res.json();
                monitorData.google = (data.items || []).slice(0, 50).map(i => ({
                    title: i.title,
                    link: i.link,
                    sub: `${i.source || '뉴스'} | ${new Date(i.pubDate).toLocaleDateString()}`,
                    today: isToday(i.pubDate)
                }));
            } else if (type === 'yt') {
                const res = await fetch(apiUrl('youtube', { q }));
                const data = await res.json();
                monitorData.yt = (data.items || []).map(v => ({
                    title: v.snippet.title,
                    link: `https://www.youtube.com/watch?v=${v.id.videoId}`,
                    sub: `${v.snippet.channelTitle} | ${new Date(v.snippet.publishedAt).toLocaleDateString()}`,
                    today: isToday(v.snippet.publishedAt)
                }));
            }
            renderMonitorList(type);
        } catch {
            div.innerHTML = '로드 실패';
        }
    }

    function renderMonitorList(type) {
        const div = document.getElementById(`${type}List`);
        const items = monitorData[type].slice(0, monitorPage[type] * 10);
        const searchTxt = document.getElementById('unifiedSearch').value.trim();
        let html = items.map(i => {
            const highlightedTitle = applyHighlight(i.title, searchTxt);
            return `<a href="${i.link}" target="_blank" class="info-item"><div class="info-title">${highlightedTitle}</div><div class="info-sub ${i.today ? 'date-today' : ''}">${i.sub}</div></a>`;
        }).join('');
        if (items.length < monitorData[type].length) html += `<button class="more-btn" onclick="monitorPage['${type}']++; renderMonitorList('${type}')">더보기 (${items.length}/${monitorData[type].length})</button>`;
        div.innerHTML = html || '결과 없음';
    }

    async function fetchSeminars(name) {
        const div = document.getElementById('seminarList');
        div.innerHTML = '조회 중...';
        try {
            const res = await fetch(apiUrl('seminars', { name, pSize: 100 }));
            const data = await res.json();
            monitorData.seminar = data.nfcoioopazrwmjrgs ? data.nfcoioopazrwmjrgs[1].row : [];
            renderSeminarList();
        } catch {
            div.innerHTML = '오류 발생';
        }
    }

    function renderSeminarList() {
        const div = document.getElementById('seminarList');
        const items = monitorData.seminar.slice(0, monitorPage.seminar * 10);
        const searchTxt = document.getElementById('unifiedSearch').value.trim();
        let html = items.map(s => {
            const highlightedTitle = applyHighlight(s.TITLE, searchTxt);
            return `<div class="info-item"><div class="info-title" onclick="if('${s.IMGLINK || ''}') window.open('${s.IMGLINK || ''}')">${highlightedTitle}</div><div class="info-sub ${isToday(s.SDATE) ? 'date-today' : ''}">일시: ${s.SDATE || '-'} | 장소: ${s.LOCATION || '-'}</div></div>`;
        }).join('');
        if (items.length < monitorData.seminar.length) html += `<button class="more-btn" onclick="monitorPage.seminar++; renderSeminarList()">더보기 (${items.length}/${monitorData.seminar.length})</button>`;
        div.innerHTML = html || '일정 없음';
    }

    function closeModal() {
        document.getElementById('detailModal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }
</script>
</body>
</html>
